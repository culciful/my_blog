server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 下面两条反代规则共用的请求头（location 里没写 proxy_set_header 就继承这里）
    # Host 用 $http_host：$host 不带端口，后端收到 localhost 而浏览器 Origin 是 localhost:8880，
    # Spring 会把 POST 判成跨域（dev profile 下 403 Invalid CORS request）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # 只信 X-Real-IP/X-Forwarded-For 里这一层加的，不透传客户端自己带的同名头，
    # 否则登录限流 / 验证码限流（RequestUtils.clientIp）会被伪造头绕过
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 头像 / 文章图片静态资源（Spring 自己映射的 /uploads/**）。
    # ^~ 必须有：不加的话下面按扩展名匹配的静态资源规则（正则）优先级更高，会把
    # /uploads/xxx.png 当成本地文件去找，404。
    # 单独拆出来也是因为：在新标签页直接打开图片链接时 Accept 含 text/html，
    # 不能被下面的"页面交给 SPA"判断截走。
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
    }

    # 后端是可读 RPC 风格（见计划书「关于接口命名风格」），路径前缀跟
    # src/model/*/constant.ts 里的 moduleName 一一对应：
    #   api      -> /api/auth/login、/api/auth/logout
    #   article  -> /article/getArticleList 等
    #   user     -> /user/getMyProfile 等
    #   comment  -> /comment/addComment 等
    # 同源部署（前端跟后端走同一个对外端口），靠 nginx 转发替代跨域。
    #
    # ⚠️ 前端路由也占着这些前缀（/article/:id、/user/userCenter、/user/manageContent……）。
    # 在浏览器地址栏直接打开 / 刷新这类页面时，请求的 Accept 含 text/html，必须交给前端，
    # 否则会被当成 API 转发给后端 404/403；axios 的 XHR/fetch 请求 Accept 是
    # application/json, */*，不含 text/html，照常转发。跟 vite.config.ts 里 dev 代理的
    # bypass（accept 含 text/html 就回 /index.html）是同一个逻辑。
    location ~ ^/(api|article|user|comment)/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8080;
        # 上传接口是 multipart，顶格给到比后端 blog.upload.image-max-size（默认5MB）略大一点的余量
        client_max_body_size 6m;
    }

    # 其余一律交给 SPA 路由（/write、/edit/1 等前端自己的路由，不是文件）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源可以放心长缓存：vite 构建产物文件名带 content hash，内容变了文件名也会变
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
