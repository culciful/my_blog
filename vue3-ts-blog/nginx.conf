server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 后端是可读 RPC 风格（见计划书「关于接口命名风格」），路径前缀就这五个，
    # 跟 src/model/*/constant.ts 里的 moduleName 一一对应：
    #   api      -> /api/auth/login、/api/auth/logout
    #   article  -> /article/getArticleList 等
    #   user     -> /user/getMyProfile 等
    #   comment  -> /comment/addComment 等
    #   uploads  -> 头像/文章图片静态资源（Spring 自己映射的 /uploads/**）
    # 同源部署（前端跟后端走同一个对外端口）——对应后端那边 CORS 收敛时定的方向：
    # 不注入 BLOG_PUBLIC_ORIGIN，后端完全不启用 CORS，这里靠 nginx 转发替代跨域。
    location ~ ^/(api|article|user|comment|uploads)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 只信 X-Real-IP/X-Forwarded-For 里这一层加的，不透传客户端自己带的同名头，
        # 否则登录限流 / 验证码限流（RequestUtils.clientIp）会被伪造头绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # 上传接口是 multipart，走上面那条 uploads/comment/article/user 前缀规则即可，
    # 这里的 client_max_body_size 顶格给到比后端 blog.upload.image-max-size（默认5MB）
    # 略大一点的余量

    # 其余一律交给 SPA 路由（/write、/article/123、/user 等前端自己的路由，不是文件）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源可以放心长缓存：vite 构建产物文件名带 content hash，内容变了文件名也会变
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
