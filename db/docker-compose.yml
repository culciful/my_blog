# 本地/测试用的容器化编排：app（前端 nginx + 后端 Spring Boot）+ mysql + mailhog。
# 三个仓库各自独立（db/springboot3-blog/vue3-ts-blog，外层没有 git），这个文件相对路径
# build 兄弟目录，跑之前保证三个仓库都在同一个父目录下（跟现在的布局一样）。
#
# 对外端口特意避开本机平时手动跑的那几个（后端8080/前端5173/MySQL84的3306），
# 这套容器可以跟你平时 npm run dev / mvn spring-boot:run 的方式同时跑，互不打架。
#
# 用法：
#   cd db
#   cp .env.example .env        # 改成真实值（MYSQL_ROOT_PASSWORD / JWT_TOKEN_SIGN_KEY）
#   docker compose up --build
# 打开 http://localhost:8880 （前端，nginx 反代 API 到 backend，同源不用管 CORS）
# 邮箱验证码在 http://localhost:8025 （mailhog web UI）看
# 直接测后端（跳过 nginx）：http://localhost:8081

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?在 .env 里设 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # blog.sql 自带 DROP DATABASE IF EXISTS + CREATE DATABASE，官方镜像只在数据目录
      # 全新（第一次启动）时才会跑 docker-entrypoint-initdb.d 里的脚本
      - ./blog.sql:/docker-entrypoint-initdb.d/01-blog.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI，看收到的验证码邮件
      # 1025(smtp)不对外暴露端口，backend 容器内部直接用服务名 mailhog:1025 访问

  backend:
    build: ../springboot3-blog
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/culciful_blog
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?在 .env 里设 MYSQL_ROOT_PASSWORD}
      JWT_TOKEN_SIGN_KEY: ${JWT_TOKEN_SIGN_KEY:?在 .env 里设 JWT_TOKEN_SIGN_KEY，至少64字符（openssl rand -hex 64）}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "8081:8080"

  frontend:
    build: ../vue3-ts-blog
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8880:80"

volumes:
  mysql-data:
  backend-uploads:
